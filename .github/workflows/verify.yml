name: Yayin dogrulama

# Her push'ta ve pull request'te calisir.
# AmacI: magazaya gondermeden once "kirmizi bayrak" olusmasini engellemek.
# Bir adim sonraki adima gecmeden once hata verip durur.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogrula:
    name: Kural + politika dogrulamasi
    runs-on: ubuntu-latest
    outputs:
      testler: ${{ steps.testleri.outputs.liste }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: DNR kural dogrulamasi
        run: node tools/validate.js

      - name: Pages kopyasi senkron mu?
        run: |
          node tools/publish-pages.js
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ klasoru web/ ile esit degil."
            echo "Duzeltmek icin: node tools/publish-pages.js && git add docs/ && git commit"
            git diff --stat -- docs/
            exit 1
          fi
          echo "docs/ senkron."

      - name: Magaza gorselleri hazir mi?
        run: node tools/check-screenshots.js

      - name: Gizlilik politikasi dosyalari var mi?
        run: |
          for f in src/privacy.html web/privacy.html docs/privacy.html; do
            test -f "$f" || { echo "::error::$f yok"; exit 1; }
          done
          echo "Gizlilik politikasi dosyalari mevcut."

      # Testleri listeleyip sonraki ise gecir.
      #
      # ONEMLI: burada SADECE .js atilir. "test-" oneki KORUNMALIDIR.
      # Once hata yapildi: onek burada kaldirilip asagida geri
      # eklenmedi, "node tools/player-detect.js" denendi ve dosya
      # yok diye dustu. "png" ise tools/png.js YANLISLIKLA calistigi
      # icin gecerli gorundu — sahte pozitif. Onek oldugu gibi birakilir.
      - name: Testleri listele
        id: testleri
        run: |
          node -e "
            const fs = require('fs');
            const a = fs.readdirSync('tools')
              .filter(f => f.endsWith('.js') && f.startsWith('test-'))
              .map(f => f.slice(0, -3))
              .sort();
            console.log('[' + JSON.stringify(a).slice(1, -1) + ']');
          " > /tmp/testler.json
          echo "liste=$(cat /tmp/testler.json)" >> "$GITHUB_OUTPUT"
          echo "Aday testler: $(cat /tmp/testler.json)"

  # Her test AYRI BIR IS olarak calisir.
  #
  # Neden matrix: testler tek adimda toplu calistirilirsa "hangi test
  # dustu" sorusunu yanitlamak icin logu okumak gerekir; oyun ici
  # loglar kimlik dogrulama ister. Matrix ile IS ADLARI dogrudan
  # okunur: basarisiz isin adi hatayi soyler.
  testler:
    name: test / ${{ matrix.test }}
    runs-on: ubuntu-latest
    needs: dogrula
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.dogrula.outputs.testler) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calistir
        run: node tools/${{ matrix.test }}.js

  yayinla:
    name: GitHub Pages
    # Yalnizca main'e dogrudan push oldugunda calisir (PR'da degil)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [dogrula, testler]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        # NOT: Bu adim "Pages kapalı" hatası verirse depo ayarı eksiktir.
        # Ayarlar -> Pages -> Build and deployment -> Source:
        #   "GitHub Actions" secili olmali.
        # Bu, depoda YALNIZCA elle yapilabilir; workflow kendisi acamaz.
        continue-on-error: false

      - name: Pages acik mi? (daha anlasilir hata icin)
        if: failure()
        run: |
          echo "::error title=Pages kapali::Bu depo icin GitHub Pages acik degil."
          echo "::error::1) https://github.com/sosyalilgi/fd-adblock/settings/pages adresine git"
          echo "::error::2) 'Build and deployment' bolumunde Source: 'GitHub Actions' sec"
          echo "::error::3) Kaydet. Bu adim elle yapilmalidir, workflow acamaz."
          echo "::error::4) Sonra degisikligi main'e pushla."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - id: deploy
        uses: actions/deploy-pages@v4